name: Keep Supabase alive

on:
  schedule:
    - cron: '0 12 * * 1,4' # lunes y jueves a las 12:00 UTC (9:00 ART)
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Pingear Supabase
        run: |
          curl -s -o /dev/null -w "HTTP %{http_code}\n" \
            "https://nbuwshbyrtjmterwmzsd.supabase.co/rest/v1/" \
            -H "apikey: ${{ secrets.SUPABASE_ANON_KEY }}"
